<!doctype html>
<html amp lang="vi">

<head>
    <meta charset="utf-8">
    <script async src="https://cdn.ampproject.org/v0.js"></script>
    <script async custom-element="amp-accordion" src="https://cdn.ampproject.org/v0/amp-accordion-0.1.js"></script>
    <script async custom-element="amp-social-share"
        src="https://cdn.ampproject.org/v0/amp-social-share-0.1.js"></script>
    <title>${titleFinal}</title>
    <link rel="canonical" href="${canonicalUrl}">
    <link rel="amphtml" href="${pagesUrl}/" />
    <link rel="alternate" hreflang="vi-VN" href="${pagesUrl}/">
    <link rel="alternate" hreflang="x-default" href="${pagesUrl}/">
    <link rel="alternate" hreflang="vi" href="${pagesUrl}/">
    <link rel="alternate" href="${pagesUrl}/">
    <link rel="alternate" hreflang="x-default" href="${pagesUrl}/">
    <meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1">
    <meta name="description" content="${descFinal}">
    <meta name="robots" content="index,follow">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="${faviconUrl}">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="${titleFinal}">
    <meta property="og:description" content="${descFinal}">
    <meta property="og:url" content="${pagesUrl}/">
    <meta property="og:image" content="${bannerUrl}">
    <meta property="og:image:alt" content="${keyword}">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="${titleFinal}">
    <meta name="twitter:description" content="${descFinal}">
    <meta name="twitter:image" content="${bannerUrl}">

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
{"@context": "https://schema.org", "@graph": [{"@type": "Article", "@id": "${pagesUrl}/#article", "headline": "${titleFinal}", "description": "${descFinal}", "image": {"@type": "ImageObject", "url": "${bannerUrl}", "width": 560, "height": 500}, "datePublished": "${datePublished}", "dateModified": "${dateModified}", "author": {"@type": "Person", "name": "${keyword}", "url": "${pagesUrl}"}, "publisher": {"@type": "Organization", "name": "${keyword}", "logo": {"@type": "ImageObject", "url": "${logoUrl}", "width": 160, "height": 44}}, "mainEntityOfPage": {"@type": "WebPage", "@id": "${pagesUrl}"}}, {"@type": "WebSite", "@id": "${pagesUrl}#website", "url": "${pagesUrl}", "name": "${keyword}"}]}
</script>
    <style amp-boilerplate>
        body {
            -webkit-animation: -amp-start 8s steps(1, end) 0s 1 normal both;
            -moz-animation: -amp-start 8s steps(1, end) 0s 1 normal both;
            -ms-animation: -amp-start 8s steps(1, end) 0s 1 normal both;
            animation: -amp-start 8s steps(1, end) 0s 1 normal both
        }

        @-webkit-keyframes -amp-start {
            from {
                visibility: hidden
            }

            to {
                visibility: visible
            }
        }

        @-moz-keyframes -amp-start {
            from {
                visibility: hidden
            }

            to {
                visibility: visible
            }
        }

        @-ms-keyframes -amp-start {
            from {
                visibility: hidden
            }

            to {
                visibility: visible
            }
        }

        @-o-keyframes -amp-start {
            from {
                visibility: hidden
            }

            to {
                visibility: visible
            }
        }

        @keyframes -amp-start {
            from {
                visibility: hidden
            }

            to {
                visibility: visible
            }
        }
    </style>
    <noscript>
        <style amp-boilerplate>
            body {
                -webkit-animation: none;
                -moz-animation: none;
                -ms-animation: none;
                animation: none
            }
        </style>
    </noscript>

    <style amp-custom>
        :root {
            --bg-url: url("${bannerUrl}");
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000000;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            font-size: 14px;
        }

        .landing-bg {
            position: fixed;
            inset: 0;
            z-index: 1;
            opacity: .86;
            background-image: var(--bg-url);
            background-repeat: repeat-x;
            background-size: auto 100%;
            background-position: center center;
            animation: scrollBg 60s linear infinite;
        }

        @keyframes scrollBg {
            0% {
                background-position: 0 center
            }

            100% {
                background-position: -2000px center
            }
        }

        .landing-overlay {
            position: fixed;
            inset: 0;
            z-index: 2;
            background: rgba(0, 0, 0, .68);
        }

        .wrap {
            position: fixed;
            inset: 0;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
        }

        .card {
            width: min(92vw, 430px);
            max-height: 96vh;
            text-align: center;
            color: #FFFFFF;
            padding: 16px 16px 14px;
            border-radius: 20px;
            background: rgba(10, 0, 0, .65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow:
                0 0 0 1px rgba(162, 27, 245, .35),
                0 20px 55px rgba(0, 0, 0, .85),
                inset 0 1px 0 rgba(255, 255, 255, .15);
        }

        .banner-frame {
            width: min(100%, 330px);
            margin: 0 auto 12px;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid #8600DB;
            box-shadow:
                0 12px 30px rgba(0, 0, 0, .65),
                0 0 16px rgba(162, 27, 245, .25);
        }

        .banner-frame amp-img {
            border-radius: 18px;
        }

        .titl {
            margin: 0 0 14px;
            font-size: 14px;
            line-height: 1.45;
            color: #fff;
            font-family: Georgia, 'Times New Roman', serif;
            font-weight: 900;
            letter-spacing: .2px;
            text-shadow:
                0 2px 5px rgba(0, 0, 0, .85),
                0 0 10px rgba(162, 27, 245, .4);
        }

        .btns {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            position: relative;
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-weight: 900;
            text-decoration: none;
            text-align: center;
            color: #fff;
            overflow: hidden;
            isolation: isolate;
            background: linear-gradient(145deg, #111111, #000000 40%, #000000);
            border: 1px solid rgba(162, 27, 245, 0.4);
            box-shadow:
                0 12px 30px rgba(0, 0, 0, .7),
                inset 0 1px 0 rgba(255, 255, 255, .3);
            transition:
                transform .18s ease,
                filter .18s ease,
                background .25s ease,
                box-shadow .25s ease;
        }

        .btn.primary {
            background: linear-gradient(145deg, #8600DB, #000000 40%, #000000);
            border: 1px solid rgba(162, 27, 245, 0.8);
            color: #ffffff;
            box-shadow:
                0 0 25px rgba(162, 27, 245, 0.35),
                0 12px 30px rgba(0, 0, 0, .8),
                inset 0 1px 0 rgba(255, 255, 255, .6);
            text-shadow:
                0 0 10px rgba(0, 0, 0, 0.8), 0 0 20px rgb(113 0 126 / 60%);
        }

        .btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 70%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, .75), transparent);
            transform: skewX(-25deg);
            animation: glossyMove 2.5s linear infinite;
        }

        .btn.primary::before {
            background: linear-gradient(120deg, transparent, rgb(148, 0, 240 / 60%), transparent);
        }

        .btn::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 14px;
            box-shadow: inset 0 0 20px rgba(255, 255, 255, .08);
        }

        @keyframes glossyMove {
            0% {
                left: -120%
            }

            100% {
                left: 140%
            }
        }

        .btn:hover,
        .btn:focus {
            transform: translateY(-2px) scale(1.015);
            background: linear-gradient(145deg, #000000, #000000 45%, #8600DB);
            box-shadow:
                0 0 22px rgba(162, 27, 245, .4),
                0 14px 32px rgba(0, 0, 0, .8),
                inset 0 1px 0 rgba(255, 255, 255, .55);
        }

        .btn.primary:hover,
        .btn.primary:focus {
            background: linear-gradient(145deg, #ffffff, #8600DB 45%, #000000);
            color: #000000;
            box-shadow:
                0 0 28px rgba(162, 27, 245, 0.65),
                0 14px 32px rgba(255, 255, 255, 0.85),
                inset 0 1px 0 rgba(255, 255, 255, .75);
        }

        .btn:active {
            transform: translateY(3px) scale(.97);
            filter: brightness(.9);
            box-shadow:
                0 4px 10px rgba(0, 0, 0, .75),
                inset 0 4px 12px rgba(0, 0, 0, .55);
        }

        .btns .btn:nth-child(1) {
            animation: slideFromLeft .75s ease both;
        }

        .btns .btn:nth-child(2) {
            animation: slideFromRight .85s ease both;
        }

        .btns .btn:nth-child(3) {
            animation: slideFromLeft .95s ease both;
        }

        @keyframes slideFromLeft {
            0% {
                opacity: 0;
                transform: translateX(-120px);
            }

            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideFromRight {
            0% {
                opacity: 0;
                transform: translateX(120px);
            }

            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .socials {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            margin-top: 14px;
            margin-bottom: 12px;
        }

        amp-social-share {
            border-radius: 10px;
        }

        .footer {
            margin-top: 8px;
            font-size: 12px;
            line-height: 1.4;
            color: #8600DB;
            text-shadow: 0 2px 5px rgba(0, 0, 0, .8);
        }

        .footer a {
            color: #fff;
            text-decoration: none;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Accordion */
        amp-accordion section {
            margin-top: 12px;
            border: 1px solid rgba(162, 27, 245, 0.4);
            border-radius: 12px;
            overflow: hidden;
            background: rgba(10, 0, 0, 0.65);
        }

        amp-accordion section>h2 {
            cursor: pointer;
            padding: 12px 14px;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: .5px;
            text-transform: uppercase;
            text-align: center;
            color: #fff;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        amp-accordion section[expanded]>h2::after {
            content: "−";
        }

        amp-accordion section>h2::after {
            content: "+";
            font-size: 16px;
            margin-left: 8px;
        }

        amp-accordion div[role="region"] {
            padding: 12px 14px;
            font-size: 12px;
            line-height: 1.6;
            text-align: justify;
            color: #e0e0e0;
        }

        amp-accordion div[role="region"] h1,
        amp-accordion div[role="region"] h2,
        amp-accordion div[role="region"] h3,
        amp-accordion div[role="region"] h4 {
            text-align: center;
        }

        @media(max-width:480px) {
            .wrap {
                padding: 10px;
            }

            .card {
                width: min(94vw, 390px);
                padding: 13px 13px 12px;
            }

            .banner-frame {
                width: min(100%, 300px);
                margin-bottom: 10px;
            }

            .titl {
                font-size: 12.5px;
                margin-bottom: 11px;
                line-height: 1.35;
            }

            .btns {
                gap: 10px;
            }

            .btn {
                padding: 12px;
            }

            .socials {
                margin-top: 11px;
                margin-bottom: 9px;
            }
        }

        @media(max-height:720px) {
            .card {
                padding: 10px;
            }

            .banner-frame {
                width: min(100%, 260px);
            }

            .titl {
                font-size: 12px;
                margin-bottom: 9px;
            }

            .btn {
                padding: 10px;
            }

            .btns {
                gap: 8px;
            }

            .socials {
                margin-top: 9px;
                margin-bottom: 7px;
            }

            .footer {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>
    <div class="landing-overlay"></div>
    <div class="landing-bg"></div>

    <main class="wrap">
        <div class="card">

            <h1 class="sr-only">${titleFinal}</h1>

            <div class="banner-frame">
                <amp-img src="${bannerUrl}" width="800" height="800"
                    layout="responsive" alt="${keyword} - Khuyến mãi Spesial">
                </amp-img>
            </div>

            <p class="titl">${titleFinal}</p>

            <div class="btns">
                <a class="btn" href="${ctaUrl}" target="_blank" rel="nofollow noreferrer noopener">ĐĂNG NHẬP</a>
                <a class="btn primary" href="${ctaUrl}" target="_blank" rel="nofollow noreferrer noopener">ĐĂNG KÝ NGAY</a>
            </div>

            <div class="socials" aria-label="Liên kết mạng xã hội">
            </div>

            <!-- Phần thông tin chi tiết, mặc định thu gọn -->
            <amp-accordion>
                <section>
                    <h2>Xem chi tiết về ${keyword}</h2>
                    <div>
                        ${cleanArtikel}
                    </div>
                </section>
            </amp-accordion>

            <div class="footer">
                <a href="${pagesUrl}/">${keyword}</a> © ${footerYear} Bảo lưu mọi quyền.
            </div>

        </div>
    </main>
</body>

</html>
